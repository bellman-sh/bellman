name: Idea or feature request
description: Something Bellman should do that it does not
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        The situation, not the solution. Bellman's shape comes from concrete
        pairings that were awkward, so the case matters more than the feature.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do today instead
      description: Including "nothing, I gave up" — that is useful signal.
    validations:
      required: false

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional. A rough shape is fine.
    validations:
      required: false
