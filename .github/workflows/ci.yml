name: CI

on:
  push:
    branches: [main]
  pull_request:

# A fork PR gets no secrets and no write access. Nothing here needs either.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Two programs, two typechecks: the Node server, and the Worker, whose
      # files are excluded from the Node build because they import
      # cloudflare:workers.
      - run: npm run typecheck
      - run: npm run typecheck:worker
      - run: npm run build
      - run: npm test
