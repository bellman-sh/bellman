name: Publish

# A GitHub release is the trigger, so the tag, the release notes and the
# registry can never disagree about what 0.1.0 is.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # mints the OIDC token npm provenance is built from

jobs:
  publish:
    runs-on: ubuntu-latest # provenance requires a GitHub-hosted runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # A release tagged v0.2.0 that ships 0.1.0 is worse than a failed publish.
      # The tag arrives through the environment, never interpolated into the
      # script: a ${{ }} expression in a run block is substituted before the
      # shell sees it, so a tag named $(...) would execute.
      - name: Tag must match package.json
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$pkg" ]; then
            echo "::error::release tag $RELEASE_TAG does not match package.json ($pkg)"
            exit 1
          fi
          echo "$RELEASE_TAG matches package.json"

      # prepublishOnly runs these too; running them here puts a failure in the
      # log next to the step that caused it.
      - run: npm run verify
      - run: npm run typecheck:worker

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
