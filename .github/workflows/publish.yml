name: Publish

# A GitHub release is the trigger, so the tag, the release notes and the
# registry can never disagree about what 0.1.0 is.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest # provenance requires a GitHub-hosted runner
    # Scoped to this job rather than the workflow: the bundle job below needs
    # contents: write to upload an asset, and nothing that handles the npm
    # credential should hold it.
    permissions:
      contents: read
      id-token: write # mints the OIDC token that authenticates the publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Node 22 bundles npm 10.x; trusted publishing needs 11.5.1 or later.
      - run: npm install -g npm@latest

      - run: npm ci

      # A release tagged v0.2.0 that ships 0.1.0 is worse than a failed publish.
      # The tag arrives through the environment, never interpolated into the
      # script: a ${{ }} expression in a run block is substituted before the
      # shell sees it, so a tag named $(...) would execute.
      - name: Tag must match package.json
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$pkg" ]; then
            echo "::error::release tag $RELEASE_TAG does not match package.json ($pkg)"
            exit 1
          fi
          echo "$RELEASE_TAG matches package.json"

      # prepublishOnly runs these too; running them here puts a failure in the
      # log next to the step that caused it.
      - run: npm run verify
      - run: npm run typecheck:worker

      # No NODE_AUTH_TOKEN: the OIDC token minted by id-token: write is the
      # credential. Provenance is generated automatically under trusted
      # publishing, so --provenance is not passed either.
      - run: npm publish --access public

  # The Claude Desktop bundle, packed from the release that just went out and
  # attached to it. Building it here is what stops the bundle drifting from the
  # server: the manifest and the code it wraps leave in the same commit, and the
  # asset a person downloads was packed from that commit.
  bundle:
    needs: publish
    # A manual dispatch has no release to attach an asset to.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write # uploads the .mcpb as a release asset
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # --from . rather than --version $TAG. The checkout *is* the tag, so the
      # bundle holds exactly the bits just published, with no wait on registry
      # propagation and no window in which npm could serve a different tarball.
      - run: ./extension/build.sh --from .

      # The asset keeps the plain name the build produces: a release scopes it
      # already, and a stable name means a download link does not change shape
      # every version. --clobber so re-running a failed job replaces the asset
      # rather than failing on a name that already exists.
      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" extension/dist/bellman.mcpb --clobber
