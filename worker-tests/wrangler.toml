# Test-only Worker config. Mirrors the real wrangler.toml's Durable Object
# topology and nothing else: no routes, no observability, no custom domain.
name = "bellman-worker-tests"
main = "../src/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "SESSION"
class_name = "SessionDO"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "RegistryDO"

[[durable_objects.bindings]]
name = "AUDIT"
class_name = "AuditDO"

[[durable_objects.bindings]]
name = "AUTH"
class_name = "AuthDO"

[[durable_objects.bindings]]
name = "HOST"
class_name = "HostDO"

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "bellman-blobs"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionDO", "RegistryDO", "AuditDO", "AuthDO", "HostDO"]

# The real wrangler.toml ships the hosted seat off. These tests are about the seat, so it is
# on here, and hostedSeatOn's own tests (tests/host.test.ts) cover the off direction.
[vars]
BELLMAN_HOSTED_SEAT = "on"
