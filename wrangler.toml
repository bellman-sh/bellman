name = "bellman"
main = "src/worker.ts"
compatibility_date = "2026-09-01"

# src/codes.ts uses randomUUID from node:crypto, and the MCP SDK reaches for a
# few node builtins. nodejs_compat covers both.
compatibility_flags = ["nodejs_compat"]

# The page the MCP Apps resource serves is a generated module, src/ui/assets.ts
# (gitignored; `npm run build:ui` is its only writer). Built here rather than
# only in the npm scripts, so every path that bundles the Worker has it:
# `wrangler deploy` from CI, `wrangler dev`, `wrangler versions upload`. #193
# passed every check and failed to deploy because CI calls wrangler directly.
[build]
command = "npm run build:ui"
watch_dir = ["src", "ui/src"]

# account_id comes from CLOUDFLARE_ACCOUNT_ID in the environment, so this
# file carries no account identifiers.

# The zone is on Cloudflare, so the Worker binds its own hostname directly and
# Cloudflare manages the DNS record for it. This also sidesteps needing a
# workers.dev subdomain at all, which is why that is switched off.
workers_dev = false

[[routes]]
pattern = "mcp.bellman.sh"
custom_domain = true

# One DO per session, a singleton registry, one audit object per org.
# See the topology comment at the top of src/store-do.ts.
[[durable_objects.bindings]]
name = "SESSION"
class_name = "SessionDO"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "RegistryDO"

[[durable_objects.bindings]]
name = "AUDIT"
class_name = "AuditDO"

[[durable_objects.bindings]]
name = "AUTH"
class_name = "AuthDO"

# The room blob store (#183): one bucket, keyed rooms/<sessionId>/<blobId>, and
# private — every byte leaves through the download route, under membership.
# `npx wrangler r2 bucket create bellman-blobs` once, before the first deploy.
[[r2_buckets]]
binding = "BLOBS"
bucket_name = "bellman-blobs"

# SQLite-backed Durable Objects. Required on the Workers Free plan, and the
# storage API is identical to the KV-backed flavour.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionDO", "RegistryDO", "AuditDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AuthDO"]

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true


# Billing: off | shadow | on (src/billing/config.ts). A var, not a secret, so
# switching it is a reviewed commit. The Stripe values stay secrets:
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET
#   npx wrangler secret put STRIPE_API_KEY        (restricted: Subscriptions read)
#   npx wrangler secret put STRIPE_PAYMENT_LINKS
[vars]
BELLMAN_BILLING = "on"

# Where the control panel is served from. Comma-separated; bare origins, no
# trailing slash — the Origin header carries neither, and parsePanelOrigins
# normalises an entry that does rather than letting it match nothing.
#
# A var rather than a secret: it is not sensitive, and changing which origins
# may hold a browser session should be a reviewed commit, the same argument this
# file already makes for BELLMAN_BILLING.
#
# Unset means no browser may sign in at all. That is the fail-closed direction;
# reading an empty allowlist as "no restriction" would accept a session cookie
# from anywhere.
BELLMAN_PANEL_ORIGINS = "https://dash.bellman.sh"

# BELLMAN_KEYS is a secret, never a var:
#   npx wrangler secret put BELLMAN_KEYS
